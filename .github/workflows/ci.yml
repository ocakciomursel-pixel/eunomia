name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege, declared rather than inherited: with no block here the job token
# takes whatever the repository default happens to be, which an org-level change can
# widen without anyone touching this file. CI only ever reads the checkout.
permissions:
  contents: read

jobs:
  contracts:
    name: Soroban contracts — cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - run: cargo test --workspace

  bindings:
    name: Generated contract bindings — fresh from wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install stellar-cli
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz \
            | tar -xz -C /usr/local/bin
          stellar --version
      - name: Build contract wasms
        run: cargo build --release --target wasm32v1-none -p treasury -p treasury_registry -p treasury_factory
      - name: Regenerate TypeScript bindings and verify no drift
        run: |
          npm --prefix packages/treasury-client run generate
          npm --prefix packages/registry-client run generate
          npm --prefix packages/factory-client run generate
          npm --prefix packages/mcp run sync:bindings
          git diff --exit-code

  web:
    name: Frontend — vitest + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Test
        working-directory: web
        run: npm test
      # The real build, gate included (check:no-secrets: no keys, no demo, no test-network
      # endpoints). The ids are stand-ins of the right shape; nothing here is deployed.
      - name: Build
        working-directory: web
        env:
          EUNOMIA_RPC_URL: https://app.example.com/api/rpc
          EUNOMIA_FACTORY_ID: CBQHNAXSI55GX2GN6D67GK7BHVPSLJUGZQEU7WJ5LKR5PNUCGLIMAO4K
          EUNOMIA_REGISTRY_ID: CA3D5KRYM6CB7OWQ6TWYRR3Z4T7GNZLKERYNZGGA5SOAOPIFY6YQGAXE
        run: npm run build

  circuits:
    name: Circuits — witness tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      # compliance.test.ts compiles compliance.circom via circomkit's WitnessTester, so
      # the circom binary must be on PATH (pinned to the version used locally). prove.test.ts
      # is pure JS but runs in the same mocha pass. No ptau/snarkjs needed for witness tests.
      - name: Install circom
        run: |
          curl -fsSL -o /usr/local/bin/circom \
            https://github.com/iden3/circom/releases/download/v2.2.3/circom-linux-amd64
          chmod +x /usr/local/bin/circom
          circom --version
      - name: Compliance circuit + prover tests
        working-directory: circuits
        run: |
          npm ci
          npm test

  packages:
    name: Packages — x402 + prover + mcp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The web app ships its own copies of the generated contract clients; regen via
      # `npm run generate` in packages/*-client keeps them byte-identical.
      - name: treasury-client — web copy in sync
        run: cmp packages/treasury-client/src/index.ts web/src/lib/treasuryClient.ts
      - name: registry-client — web copy in sync
        run: cmp packages/registry-client/src/index.ts web/src/lib/registryClient.ts
      - name: factory-client — web copy in sync
        run: cmp packages/factory-client/src/index.ts web/src/lib/factoryClient.ts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: x402 — bounded gate tests
        working-directory: packages/x402
        run: |
          npm ci
          npm test
      - name: prover — CSPRNG salt + chain + encode tests
        working-directory: packages/prover
        run: |
          npm ci
          npm test
      # eunomia-mcp vendors the generated treasury client so it can be published on its
      # own; the copy must stay byte-identical to the source of truth.
      - name: mcp — vendored treasury binding in sync
        run: cmp packages/treasury-client/src/index.ts packages/mcp/src/bindings/treasury.ts
      # The dashboard decodes exception requests with a verbatim copy of the codec.
      - name: mcp — exception codec copy in web in sync
        run: cmp packages/mcp/src/exceptionCodec.ts web/src/lib/exceptionCodec.ts
      # …and the budget request links the agent signs, read by the Agent page.
      - name: mcp — budget request codec copy in web in sync
        run: cmp packages/mcp/src/budgetRequestCodec.ts web/src/lib/budgetRequestCodec.ts
      - name: mcp — unit tests + build
        working-directory: packages/mcp
        run: |
          npm ci
          npm test
          npm run build
